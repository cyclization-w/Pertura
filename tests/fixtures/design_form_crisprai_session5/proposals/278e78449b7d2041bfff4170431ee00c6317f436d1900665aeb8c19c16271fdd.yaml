schema: pertura.design/v1
units:
  independent_unit:
    value: none
    status: proposed
    source: GSE220974 file names and cell metadata (orig.ident D1, D2, D3, S1Sa, S2Sp, S3SaSp); K562 is one cell line, all
      six captures read as female
    note: The files do not show separate mice, donors or cultures. The six captures are read as separate captures, which may
      be lanes, wells or separate experiments. The captures were run on two days, but which capture ran on which day is unknown,
      so no day is encoded here.
  unit_identification:
    value: cell_table_column
    status: proposed
    source: cell metadata column orig.ident (one value per capture)
  unit_column:
    value: orig.ident
    status: observed
    source: GSE220974_K562_cell_metadata.csv.gz
perturbation:
