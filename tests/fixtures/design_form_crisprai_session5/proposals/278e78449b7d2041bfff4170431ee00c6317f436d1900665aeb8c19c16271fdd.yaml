  controls:
    value:
    - name: non_targeting_CRISPRi
      kind: non_targeting
      guides:
      - NTC-1-i
      - NTC-2-i
      - NTC-3-i
      - NTC-4-i
      - NTC-5-i
      - NTC-6-i
      mode: CRISPRi
    - name: non_targeting_CRISPRa
      kind: non_targeting
      guides:
      - NTC-7-a
      - NTC-8-a
      - NTC-9-a
      - NTC-10-a
      - NTC-11-a
      - NTC-12-a
      mode: CRISPRa
    status: reported
    source: feature reference target_gene_name 'Non-Targeting' (12 guides), split by arm suffix
    note: No safe-targeting or intergenic guide is labelled. Kind non_targeting is the feature reference's label; the user
      confirms that none is a cutting control.
  reference_matches:
    value:
    - mode
    status: inferred
    source: 'guide names and scaffold patterns: each arm has its own non-targeting guides (NTC-1..6-i and NTC-7..12-a)'
    note: 'Each target is compared with the controls of its own arm: CRISPRa targets with NTC-7..12-a, CRISPRi targets with
      NTC-1..6-i.'
  delivery:
    value:
      by_unit:
        D1: pairs
        D2: pairs
        D3: pairs
        S1Sa: singles
        S2Sp: singles
        S3SaSp: singles
    status: observed
    source: 'guide calls per capture: D captures have about 84% of cells with two targets (one -a and one -i guide); S captures
      have none'
    note: Pairs are a -a guide and an -i guide in the same cell; the D captures show both arms in one cell.
  assignment:
    value:
      rule: deposit
    status: observed
    source: call files GSE220974_*_protospacer_calls_per_cell.csv.gz (Cell Ranger style calls, by barcode)
experiment:
  conditions:
    value: []
    status: reported
    source: 'user''s answer on the confirmation form: there are no conditions; every cell was treated the same way'
    note: The captures were run on two days, but which capture ran on which day is unknown, so no day or expression group
      is encoded as a condition.
  context:
    value: cell_line
    status: reported
    source: user's note (K562) and the K562 cell metadata table
  organism:
    value: human
    status: observed
    source: ENSG gene IDs in the feature reference; K562 is a human line
