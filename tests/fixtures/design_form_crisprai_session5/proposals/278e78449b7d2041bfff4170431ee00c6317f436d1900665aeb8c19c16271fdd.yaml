    status: reported
    source: user's answer on the confirmation form; guide names (-a, -i, -e) and the feature reference's two scaffold patterns
      (TGTTTCCAGAGTACTATAAC for -a, TTCCAGCATAGCTCTTAAAC for -i)
    note: 'Both CRISPRa and CRISPRi are in every cell. A guide''s scaffold decides its mode: -a guides carry the Sa scaffold
      and activate, -i guides carry the Sp scaffold and interfere.'
