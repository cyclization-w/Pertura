[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pertura"
version = "0.3.0"
description = "A Claude Code plugin and MCP server for analysing Perturb-seq screens"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
single-cell = ["anndata", "scanpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pertura = ["r/*.R", "recipes/*/*.py", "recipes/*/*.json", "recipes/*/*.md"]

[tool.pytest.ini_options]
# `python -m pytest tests` runs every test; `-m "not slow"` leaves out the slow ones, which tests/conftest.py lists.
markers = ["slow: left out by -m 'not slow'; tests/conftest.py lists which"]
